name: Actualizar indicadores

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-indicadores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos y actualizar index.html
        run: python scripts/update_data.py index.html
      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "aqsiona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Actualizar indicadores ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push
